name: Build DAC image

on:
  push:
    branches:
      - dac
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Create .version file
      run: echo "$(git describe --tags --abbrev=0 2>/dev/null || echo dev)-dac" > .version

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: |
          ghcr.io/digitalactiveconsulting/signature:latest
          ghcr.io/digitalactiveconsulting/signature:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
